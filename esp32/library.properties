sentence=Modern NFC reader/writer stack (PN7160/NCI) for ESP32.
paragraph=Drive an NXP PN7160/PN7161 over I2C: tag discovery (NFC-A/B/F/V), NFC Forum Type 4 Tag NDEF read/write, DESFire EV1/EV2/EV3 and NTAG 424 DNA secure messaging (AES, SDM/SUN, LRP), and MIFARE Classic. Host-side crypto via the ESP32's bundled mbedTLS. ALPHA - API/ABI may change; not yet hardware-verified on ESP32.
